    /* =========================================================
       2. CHẾ ĐỘ BÚT TÍCH: CẶP ĐỐI CHIẾU SONG SONG
    ========================================================= */
    async function renderHandwritingMode(st) {
      const container = document.getElementById("hwPairsList");
      container.innerHTML = '<div style="color:#94a3b8;">⏳ Đang tạo các ô đối chiếu trực tiếp từ bài thi...</div>';

      const page1Url = (st.graded_pages && st.graded_pages[0]) || "";
      if (!page1Url) {
        container.innerHTML = '<div style="color:#f87171;">Không tìm thấy ảnh scan bài thi của học sinh này.</div>';
        return;
      }

      // Đảm bảo ảnh Page 1 đã nạp xong
      if (!loadedPage1Img || loadedPage1Img.src !== page1Url || !loadedPage1Img.complete) {
        await new Promise(resolve => {
          loadedPage1Img = new Image();
          loadedPage1Img.onload = resolve;
          loadedPage1Img.onerror = resolve;
          loadedPage1Img.src = page1Url;
        });
      }

      container.innerHTML = "";
      const p3 = (st.mcq && st.mcq.p3_details) || [];
      const eid = (currentExamConfig && currentExamConfig.exam_id) || "";

      if (p3.length === 0) {
        container.innerHTML = `
          <div style="background:#1e293b; border:1px solid #334155; border-radius:10px; padding:24px 30px; text-align:center; max-width:560px; margin-top:40px;">
            <div style="font-size:16px; font-weight:800; color:#38bdf8; margin-bottom:8px;">Môn thi này không có Phần Trả Lời Ngắn</div>
            <div style="font-size:13px; color:#cbd5e1; margin-bottom:16px;">Thầy có thể chuyển sang Tab <b>1. Phiếu OMR</b> hoặc Tab <b>3. Tự Luận</b> để đối soát bài làm.</div>
            <button class="btn btn-primary" onclick="switchMode('ESSAY')">📝 Chuyển sang Tab 3. Tự Luận</button>
          </div>
        `;
        return;
      }

      // Danh sách câu trả lời ngắn theo môn (Toán 7: 8 câu C15-C22; Toán 8: 4 câu C15-C18)
      const rowsToRender = (eid === "2026_2027_GK1_Toan8")
        ? [
            { qid: 'C15', x1: 0.02, x2: 0.75, y1: 0.52, y2: 0.72 },
            { qid: 'C16', x1: 0.02, x2: 0.75, y1: 0.52, y2: 0.72 },
            { qid: 'C17', x1: 0.02, x2: 0.75, y1: 0.52, y2: 0.72 },
            { qid: 'C18', x1: 0.02, x2: 0.75, y1: 0.52, y2: 0.72 }
          ]
        : P3_ROWS_RATIO;

      // Render từng câu Phần III
      rowsToRender.forEach((rowCfg, idx) => {
        const q = p3.find(it => (it.question_id === rowCfg.qid || it.question_no === rowCfg.qid)) || p3[idx] || {};
        const qId = rowCfg.qid;
        const maxQScore = Number(q.max_score || (eid === "2026_2027_GK1_Toan8" ? 0.5 : 0.25));
        const rawText = String(q.raw_student_text || q.student_answer || "").trim();
        const score = Number(q.score || 0);
        const officialKey = q.official_key || "";
        const isCorrect = (score >= maxQScore && maxQScore > 0);

        let isSuspicious = false;
        let suspMsg = "";
        if ((rawText === "" || rawText === "(Trống)") && st.total_score > 0) {
          isSuspicious = true;
          suspMsg = "⚠️ Báo trống (Soi ảnh xem có nét mờ không)";
        } else if (score === 0 && rawText !== "" && rawText !== "(Trống)") {
          isSuspicious = true;
          suspMsg = "❓ Có viết bài nhưng nhận 0,00đ";
        }

        const card = document.createElement("div");
        card.className = "hw-pair-card " + (isSuspicious ? "suspicious" : "");
        card.id = `hw_card_${qId}`;

        // Tùy chọn điểm phù hợp theo maxQScore (0.25đ hoặc 0.50đ)
        let scoreOpts = `<option value="0.00" ${score === 0 ? 'selected' : ''}>0,00đ (Sai)</option>`;
        if (maxQScore >= 0.5) {
          scoreOpts = `
            <option value="0.50" ${score >= 0.5 ? 'selected' : ''}>+0,50đ (Đạt trọn)</option>
            <option value="0.25" ${score === 0.25 ? 'selected' : ''}>+0,25đ (Đạt 1/2)</option>
            <option value="0.00" ${score === 0 ? 'selected' : ''}>0,00đ (Sai)</option>
          `;
        } else {
          scoreOpts = `
            <option value="0.25" ${score >= 0.25 ? 'selected' : ''}>+0,25đ (Đạt)</option>
            <option value="0.00" ${score === 0 ? 'selected' : ''}>0,00đ (Sai)</option>
          `;
        }

        card.innerHTML = `
          <!-- BÊN TRÁI: ẢNH CROP BÚT TÍCH THẬT TRÊN GIẤY -->
          <div class="hw-crop-side">
            <div class="hw-crop-header">
              <span>BÚT TÍCH THỰC TẾ TRÊN BÀI THI (GROUND TRUTH)</span>
              <span>${q.question_no || qId}</span>
            </div>
            <div class="hw-canvas-box">
              <canvas id="crop_canvas_${qId}"></canvas>
            </div>
          </div>

          <!-- BÊN PHẢI: NỘI DUNG AI ĐỌC & NÚT SỬA 1 CHẠM -->
          <div class="hw-ai-side">
            <div>
              <div class="hw-qno">
                <span>${q.question_no || qId}: ${q.prompt || ''}</span>
                <span class="hw-score-pill ${isCorrect ? 'ok' : 'fail'}">${score.toFixed(2)} / ${maxQScore.toFixed(2)}đ</span>
              </div>
              ${isSuspicious ? `<div style="margin-top:4px;"><span class="hw-warning-tag">${suspMsg}</span></div>` : ''}
            </div>

            <div class="hw-extracted-box">
              <div>
                <div style="font-size:11px; color:#94a3b8;">AI đã bóc tách:</div>
                <div class="hw-text-val katex-render">${escapeHtml(rawText || '(Trống)')}</div>
              </div>
              <div style="text-align:right;">
                <div class="hw-official-key">Đáp án chuẩn: <b>${escapeHtml(officialKey)}</b></div>
                <button class="btn btn-dark" style="margin-top:4px; padding:3px 8px; font-size:11px;" onclick="toggleHwEdit('${qId}')">✏️ Báo sai / Sửa câu này</button>
              </div>
            </div>

            <!-- Khung sửa nhanh ẩn -->
            <div class="hw-edit-panel" id="hw_edit_${qId}" style="display:none;">
              <div class="hw-edit-row">
                <label>Chữ HS viết:</label>
                <input type="text" id="hw_input_text_${qId}" value="${escapeHtml(rawText)}" placeholder="Nhập đúng chữ viết tay">
              </div>
              <div class="hw-edit-row">
                <label>Mức điểm:</label>
                <select id="hw_input_score_${qId}" style="max-width:140px;">
                  ${scoreOpts}
                </select>
                <button class="btn btn-success" style="padding:4px 10px;" onclick="saveHwEdit('${qId}')">💾 Lưu câu này</button>
                <button class="btn btn-dark" style="padding:4px 8px;" onclick="toggleHwEdit('${qId}')">Đóng</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);

        // Vẽ crop Canvas
        setTimeout(() => drawHwCropCanvas(qId, rowCfg.y1, rowCfg.y2, rowCfg.x1, rowCfg.x2), 10);
      });

      triggerMathRender();
    }

    function drawHwCropCanvas(qId, y1Ratio, y2Ratio, x1Ratio, x2Ratio) {
      const canvas = document.getElementById(`crop_canvas_${qId}`);
      if (!canvas || !loadedPage1Img || !loadedPage1Img.naturalWidth) return;

      const imgW = loadedPage1Img.naturalWidth;
      const imgH = loadedPage1Img.naturalHeight;

      const st = studentsList[currentStudentIndex];
      const sKey = st ? getStudentKey(st) : "";
      const dynData = p3DynamicBboxes[sKey];
      const bbox = (dynData && dynData.bboxes && dynData.bboxes[qId]) || null;

      let sx, sw, sy, sh;
      if (bbox) {
        sx = Math.max(0, Math.round(bbox.x1 * imgW));
        const ex = Math.min(imgW, Math.round(bbox.x2 * imgW));
        sw = Math.max(10, ex - sx);
        sy = Math.max(0, Math.round(bbox.y1 * imgH));
        const ey = Math.min(imgH, Math.round(bbox.y2 * imgH));
        sh = Math.max(10, ey - sy);
      } else {
        const rx1 = (x1Ratio !== undefined) ? x1Ratio : 0.010;
        const rx2 = (x2Ratio !== undefined) ? x2Ratio : 0.320;
        sx = Math.round(rx1 * imgW);
        sw = Math.round((rx2 - rx1) * imgW);
        sy = Math.round(y1Ratio * imgH);
        sh = Math.round((y2Ratio - y1Ratio) * imgH);
      }

      canvas.width = sw;
      canvas.height = sh;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(loadedPage1Img, sx, sy, sw, sh, 0, 0, sw, sh);
    }

    function toggleHwEdit(qId) {
      const pnl = document.getElementById(`hw_edit_${qId}`);
      if (pnl) pnl.style.display = (pnl.style.display === "none" ? "flex" : "none");
    }

    function saveHwEdit(qId) {
      const st = studentsList[currentStudentIndex];
      const p3 = (st.mcq && st.mcq.p3_details) || [];
      const q = p3.find(it => (it.question_id === qId || it.question_no === qId));
      if (!q) return;

      const newText = document.getElementById(`hw_input_text_${qId}`).value.trim();
      const newScore = parseFloat(document.getElementById(`hw_input_score_${qId}`).value) || 0.0;

      q.raw_student_text = newText;
      q.student_text = newText;
      q.student_answer = newText;
      q.score = newScore;
      q.is_correct = (newScore > 0);
      q.ok = (newScore > 0);
      q.teacher_note = `Giáo viên xác nhận: ${newScore > 0 ? 'Chính xác (+0,25đ)' : 'Chưa chính xác (0,00đ)'}.`;

      let p3Tot = 0;
      p3.forEach(it => { p3Tot += (it.score || 0); });
      st.mcq.p3_score = Math.round(p3Tot * 100) / 100;

      recalculateAndSave(st);
      renderHandwritingMode(st);
      showToast(`Đã cập nhật ${qId}: ${newText} (${newScore}đ)`);
    }

    /* =========================================================
       3. CHẾ ĐỘ DUYỆT TỰ LUẬN (TRÁI: ẢNH GHÉP T1+T2 • PHẢI: BÚT TÍCH)
    ========================================================= */
    async function renderEssayMode(st) {
      const p1Url = (st.graded_pages && st.graded_pages[0]) || "";
      const p2Url = (st.graded_pages && st.graded_pages[1]) || "";

      // Hiển thị tổng điểm tự luận
      const essayTot = Number(st.essay_score || 0);
      const essayMax = Number(st.essay_max || 3.0);
      const totPill = document.getElementById("essayTotalPill");
      if (totPill) {
        totPill.textContent = `${essayTot.toFixed(2)} / ${essayMax.toFixed(2)}đ`;
      }

      // 1. Nạp ảnh Trang 1
      if (p1Url) {
        if (!loadedPage1Img || loadedPage1Url !== p1Url || !loadedPage1Img.complete) {
          loadedPage1Url = p1Url;
          await new Promise(res => {
            loadedPage1Img = new Image();
            loadedPage1Img.onload = res;
            loadedPage1Img.onerror = res;
            loadedPage1Img.src = p1Url;
          });
        }
      }

      // 2. Nạp ảnh Trang 2 (nếu có)
      if (p2Url) {
        if (!loadedPage2Img || loadedPage2Url !== p2Url || !loadedPage2Img.complete) {
          loadedPage2Url = p2Url;
          await new Promise(res => {
            loadedPage2Img = new Image();
            loadedPage2Img.onload = res;
            loadedPage2Img.onerror = res;
            loadedPage2Img.src = p2Url;
          });
        }
      }

      // Reset thanh cuộn 2 cột về đầu bài
      const leftScroll = document.getElementById("essayImagesScroll");
      const rightScroll = document.getElementById("essayCardsScroll");
      if (leftScroll) leftScroll.scrollTop = 0;
      if (rightScroll) rightScroll.scrollTop = 0;

      // Vẽ Canvas Trang 1 (Phần Tự luận B từ sau Câu 22 đến hết trang)
      drawEssayCanvasP1(st);

      // Vẽ Canvas Trang 2 (Toàn bộ mặt giấy bài làm tự luận của học sinh)
      const divider = document.getElementById("essayP2Divider");
      const p2Wrap = document.getElementById("essayCanvasP2Wrap");
      if (p2Url && loadedPage2Img && loadedPage2Img.naturalWidth) {
        if (divider) divider.style.display = "block";
        if (p2Wrap) p2Wrap.style.display = "flex";
        drawEssayCanvasP2();
      } else {
        if (divider) divider.style.display = "none";
        if (p2Wrap) p2Wrap.style.display = "none";
      }

      // 3. Render danh sách các câu tự luận ở Cột Phải
      renderEssayCards(st);
      applyEssayZoom();
      triggerMathRender();
    }

    function drawEssayCanvasP1(st) {
      const canvas = document.getElementById("essayCanvasP1");
      if (!canvas || !loadedPage1Img || !loadedPage1Img.naturalWidth) return;

      const iw = loadedPage1Img.naturalWidth;
      const ih = loadedPage1Img.naturalHeight;

      // Tìm vị trí bắt đầu phần Tự luận theo từng môn (chuẩn hóa theo tỷ lệ chiều cao để hoạt động đúng mọi độ phân giải)
      const cfg = getCurrentOmrConfig();
      const sKey = getStudentKey(st);
      const dynData = p3DynamicBboxes[sKey];
      let yStartRatio = cfg.essayY1Ratio || 0.655;
      if (dynData && dynData.b_px && dynData.step_px) {
        // b_px & step_px được đo trên ảnh gốc chiều cao 2200px -> quy đổi sang tỷ lệ chuẩn [0.50..0.85]
        yStartRatio = Math.min(0.85, Math.max(0.50, (dynData.b_px + 12.2 * dynData.step_px) / 2200.0));
      }
      const yStart = Math.round(yStartRatio * ih);

      // Cắt từ mép trái đến vạch đỏ phân cách sidebar (x = 1656px trên khổ 2185px, ~0.758)
      const cutW = Math.round(0.758 * iw);
      const cutH = Math.max(50, ih - yStart);

      canvas.width = cutW;
      canvas.height = cutH;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(loadedPage1Img, 0, yStart, cutW, cutH, 0, 0, cutW, cutH);
    }

    function drawEssayCanvasP2() {
      const canvas = document.getElementById("essayCanvasP2");
      if (!canvas || !loadedPage2Img || !loadedPage2Img.naturalWidth) return;

      const iw = loadedPage2Img.naturalWidth;
      const ih = loadedPage2Img.naturalHeight;

      // Trang 2: Cắt trọn vẹn toàn bộ phần bài làm bên trái (đến trước vạch đỏ sidebar)
      const cutW = Math.round(0.758 * iw);
      const cutH = ih;

      canvas.width = cutW;
      canvas.height = cutH;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(loadedPage2Img, 0, 0, cutW, cutH, 0, 0, cutW, cutH);
    }

    function changeEssayZoom(delta) {
      essayZoomLevel = Math.max(60, Math.min(220, essayZoomLevel + delta));
      applyEssayZoom();
    }

    function resetEssayZoom() {
      essayZoomLevel = 100;
      applyEssayZoom();
    }

    function applyEssayZoom() {
      const c1 = document.getElementById("essayCanvasP1");
      const c2 = document.getElementById("essayCanvasP2");
      const valEl = document.getElementById("essayZoomVal");
      if (valEl) valEl.textContent = `${essayZoomLevel}%`;

      const wStr = `${essayZoomLevel}%`;
      if (c1) c1.style.width = wStr;
      if (c2) c2.style.width = wStr;
    }

    function renderEssayCards(st) {
      const container = document.getElementById("essayCardsScroll");
      if (!container) return;
      container.innerHTML = "";

      let qs = st.questions || [];
      if (qs.length === 0) {
        // Fallback chuẩn 3 câu tự luận của bài GK1 Toán 7
        qs = [
          { question_no: "Câu 23", max_score: 1.5, score: 0.0, steps: [] },
          { question_no: "Câu 24", max_score: 1.0, score: 0.0, steps: [] },
          { question_no: "Câu 25", max_score: 0.5, score: 0.0, steps: [] }
        ];
        st.questions = qs;
      }

      qs.forEach((q, idx) => {
        const qNo = q.question_no || `Câu ${idx + 23}`;
        const score = Number(q.score || 0);
        const maxScore = Number(q.max_score || (idx === 0 ? 1.5 : (idx === 1 ? 1.0 : 0.5)));
        const steps = q.steps || [];
        const rawText = q.raw_student_text || q.student_answer || "";

        let badgeCls = "zero";
        if (score >= maxScore && maxScore > 0) badgeCls = "full";
        else if (score > 0) badgeCls = "part";

        const card = document.createElement("div");
        card.className = "essay-q-card";
        card.id = `essay_q_card_${idx}`;

        let stepsHtml = "";
        if (steps.length > 0) {
          stepsHtml = '<div class="essay-step-list">';
          steps.forEach(s => {
            const isOk = s.ok !== false && (s.kind !== "missing");
            const lbl = s.label || (isOk ? "Đúng" : "Sai");
            const stText = (s.student_text || "").trim();
            const note = (s.note || "").trim();
            stepsHtml += `
              <div class="essay-step-item">
                <div class="essay-step-top">
                  <span class="essay-step-pill ${isOk ? 'ok' : 'no'}">${escapeHtml(lbl)}</span>
                </div>
                ${stText ? `<div class="essay-step-text">${escapeHtml(stText)}</div>` : ''}
                ${(note && note !== stText) ? `<div class="essay-step-note">${escapeHtml(note)}</div>` : ''}
              </div>
            `;
          });
          stepsHtml += '</div>';
        }

        // Tạo danh sách các nút chọn điểm nhanh
        let quickBtnsHtml = "";
        const stepVal = 0.25;
        for (let sv = 0; sv <= maxScore + 0.001; sv += stepVal) {
          const v = Math.round(sv * 100) / 100;
          quickBtnsHtml += `<button type="button" class="essay-qscore-btn" onclick="setEssayQuickScore(${idx}, ${v})">${v.toFixed(2)}đ</button>`;
        }

        card.innerHTML = `
          <div class="essay-q-head">
            <span class="essay-q-title">${escapeHtml(qNo)}</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="essay-score-badge ${badgeCls}" id="essay_score_badge_${idx}">
                ${score.toFixed(2)} / ${maxScore.toFixed(2)}đ
              </span>
              <button class="btn btn-dark" style="padding:2px 8px; font-size:11px;" onclick="toggleEssayEdit(${idx})">✏️ Sửa điểm</button>
            </div>
          </div>

          ${rawText ? `<div class="essay-raw-box"><div style="font-size:11px; color:#94a3b8; margin-bottom:2px;">Bút tích bóc tách:</div>${escapeHtml(rawText)}</div>` : ''}

          ${stepsHtml}

          ${q.teacher_note ? `<div class="essay-teacher-note"><b>Lời phê GV:</b> ${escapeHtml(q.teacher_note)}</div>` : ''}

          <!-- KHUNG CHỈNH SỬA ĐIỂM & LỜI PHÊ (ẨN/HIỆN) -->
          <div class="essay-edit-panel" id="essay_edit_panel_${idx}" style="display:none;">
            <div style="font-size:11.5px; font-weight:700; color:#38bdf8;">Chấm lại ${escapeHtml(qNo)} (Tối đa ${maxScore.toFixed(2)}đ):</div>
            <div class="essay-quick-scores">
              ${quickBtnsHtml}
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <label style="color:#94a3b8; font-weight:600;">Mức điểm:</label>
              <input type="number" id="essay_input_score_${idx}" min="0" max="${maxScore}" step="0.125" value="${score}" style="width:90px; padding:4px 8px; background:#1e293b; color:#fff; border:1px solid #475569; border-radius:4px; font-size:13px; font-weight:700;">
              <span style="color:#94a3b8;">/ ${maxScore.toFixed(2)}đ</span>
            </div>
            <div>
              <label style="color:#94a3b8; font-weight:600; font-size:11.5px; display:block; margin-bottom:4px;">Ghi chú / Nhận xét của Thầy:</label>
              <textarea id="essay_input_note_${idx}" placeholder="Nhập lời phê của Thầy (nếu có)...">${escapeHtml(q.teacher_note || '')}</textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
              <button class="btn btn-dark" style="padding:4px 10px;" onclick="toggleEssayEdit(${idx})">Hủy</button>
              <button class="btn btn-success" style="padding:4px 14px;" onclick="saveEssayQuestion(${idx})">💾 Lưu câu này</button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleEssayEdit(idx) {
      const pnl = document.getElementById(`essay_edit_panel_${idx}`);
      if (pnl) pnl.style.display = (pnl.style.display === "none" ? "flex" : "none");
    }

    function setEssayQuickScore(idx, val) {
      const inp = document.getElementById(`essay_input_score_${idx}`);
      if (inp) inp.value = val;
    }

    function saveEssayQuestion(idx) {
      const st = studentsList[currentStudentIndex];
      const qs = st.questions || [];
      const q = qs[idx];
      if (!q) return;

      const inpScore = document.getElementById(`essay_input_score_${idx}`);
      const inpNote = document.getElementById(`essay_input_note_${idx}`);
      if (!inpScore) return;

      const newScore = Math.max(0, Math.min(Number(q.max_score || 3.0), parseFloat(inpScore.value) || 0.0));
      const newNote = inpNote ? inpNote.value.trim() : "";

      q.score = newScore;
      if (newNote) q.teacher_note = newNote;

      // Tính lại tổng điểm tự luận của học sinh
      let essaySum = 0;
      qs.forEach(it => { essaySum += Number(it.score || 0); });
      st.essay_score = Math.round(essaySum * 100) / 100;

      recalculateAndSave(st);
      renderEssayCards(st);
      triggerMathRender();

      // Cập nhật ngay thanh điểm tự luận
      const totPill = document.getElementById("essayTotalPill");
      if (totPill) {
        const essayMax = Number(st.essay_max || 3.0);
        totPill.textContent = `${st.essay_score.toFixed(2)} / ${essayMax.toFixed(2)}đ`;
      }

      showToast(`Đã lưu ${q.question_no || 'Câu ' + (idx+23)}: ${newScore.toFixed(2)}đ`);
    }

    /* =========================================================
       4. CHẾ ĐỘ TOÀN BỘ BÀI SCAN
    ========================================================= */
    function showFullPage(pageIdx) {
      const st = studentsList[currentStudentIndex];
      const pages = st.graded_pages || [];
      const img = document.getElementById("fullPaperImg");
      if (pages[pageIdx]) {
        img.src = pages[pageIdx] + "?v=" + Date.now();
      }
    }

    /* =========================================================
       TÍNH ĐIỂM & LƯU TRỮ
    ========================================================= */
    function recalculateAndSave(st) {
      const mcq = st.mcq || {};
      const p1 = Number(mcq.p1_score || 0);
      const p2 = Number(mcq.p2_score || 0);
      const p3 = Number(mcq.p3_score || 0);
      const essay = Number(st.essay_score || 0);

      const mcqTot = Math.round((p1 + p2 + p3) * 100) / 100;
      const tot = Math.round((mcqTot + essay) * 100) / 100;

      mcq.total_score = mcqTot;
      st.total_score = tot;
      st.score = tot;

      document.getElementById("stTotalScore").textContent = `${tot.toFixed(2)}đ`;

      const sKey = getStudentKey(st);
      const rec = getStudentAuditRecord(st);
      if (currentMode === "OMR") rec.omr = true;
      else if (currentMode === "HW") rec.hw = true;
      else if (currentMode === "ESSAY") rec.essay = true;
      rec.verified = isStudentFullyVerified(st);
      st.audit_tabs = { ...rec };
      st.audit_status = rec.verified ? "verified" : "partial";
      studentAuditStatus[sKey] = rec;

      saveLocalAuditCache();
      updateAuditUI();
    }

    /* Duyệt riêng Tab hiện tại (Phím Space) */
    function markCurrentTabVerified() {
      if (studentsList.length === 0) return;
      const st = studentsList[currentStudentIndex];
      const sKey = getStudentKey(st);
      const rec = getStudentAuditRecord(st);

      let tabLabel = "Tab Này";
      if (currentMode === "OMR") {
        rec.omr = true;
        tabLabel = "OMR";
      } else if (currentMode === "HW") {
        rec.hw = true;
        tabLabel = "Điền Khuyết";
      } else if (currentMode === "ESSAY") {
        rec.essay = true;
        tabLabel = "Tự Luận";
      } else if (currentMode === "FULL") {
        rec.omr = true;
        rec.hw = true;
        rec.essay = true;
        tabLabel = "Toàn Bài";
      }

      rec.verified = isStudentFullyVerified(st);
      rec.last_updated = new Date().toISOString();
      st.audit_tabs = { ...rec };
      st.audit_status = rec.verified ? "verified" : "partial";
      st.verified_at = rec.last_updated;
      studentAuditStatus[sKey] = rec;

      saveLocalAuditCache();
      showToast(`✅ Đã duyệt ${tabLabel}: ${st.student_name}!`);

      renderStudentDropdownItem(currentStudentIndex);
      updateAuditUI();

      // Nếu đang bật lọc "Chưa duyệt Tab này", lọc lại; nếu không thì chuyển học sinh tiếp theo (giữ nguyên Tab)
      const fSel = document.getElementById("filterSelect");
      if (fSel && fSel.value === "TAB_PENDING") {
        filterAndRenderStudents();
      } else {
        if (currentStudentIndex < studentsList.length - 1) {
          navigateStudent(1);
        } else {
          loadCurrentStudent();
        }
      }
    }

    /* Duyệt trọn vẹn cả bài (Phím Shift + Space hoặc Ctrl + Space) */
    function markCurrentStudentAllVerified() {
      if (studentsList.length === 0) return;
      const st = studentsList[currentStudentIndex];
      const sKey = getStudentKey(st);
      const rec = getStudentAuditRecord(st);

      rec.omr = true;
      rec.hw = true;
      rec.essay = true;
      rec.verified = true;
      rec.last_updated = new Date().toISOString();
      st.audit_tabs = { ...rec };
      st.audit_status = "verified";
      st.verified_at = rec.last_updated;
      studentAuditStatus[sKey] = rec;

      saveLocalAuditCache();
      showToast(`🌟 Đã duyệt toàn bài (cả 3 phần): ${st.student_name}!`);

      renderStudentDropdownItem(currentStudentIndex);
      updateAuditUI();

      if (currentStudentIndex < studentsList.length - 1) {
        navigateStudent(1);
      } else {
        loadCurrentStudent();
      }
    }

    function renderStudentDropdownItem(idx) {
      const opt = document.querySelector(`#studentSelect option[value="${idx}"]`);
      if (!opt || !studentsList[idx]) return;
      const st = studentsList[idx];
      const icon = getStudentAuditIcon(st);
      opt.textContent = `${icon} [${st.student_class}] ${st.stt}. ${st.student_name} (${(st.total_score||0).toFixed(2)}đ)`;
    }

    function saveLocalAuditCache() {
      if (!currentExamConfig) return;
      const key = `gv_audit_${currentExamConfig.exam_id}`;
      localStorage.setItem(key, JSON.stringify({
        status: studentAuditStatus,
        last_saved: new Date().toISOString()
      }));
    }

    function loadLocalAuditCache(examId) {
      const key = `gv_audit_${examId}`;
      const raw = localStorage.getItem(key);
      if (raw) {
        try {
          const d = JSON.parse(raw);
          studentAuditStatus = d.status || {};
        } catch (e) {}
      } else {
        studentAuditStatus = {};
      }
    }

    async function saveVerifiedData() {
      if (!currentExamConfig || !allExamData) return;
      showToast("💾 Đang lưu dữ liệu chuẩn...");

      // Gắn thông tin audit_tabs và audit_status vào từng học sinh trước khi lưu
      (allExamData.students || []).forEach(s => {
        const r = getStudentAuditRecord(s);
        s.audit_tabs = r;
        s.audit_status = isStudentFullyVerified(s) ? "verified" : (r.omr || r.hw || r.essay ? "partial" : "pending");
      });

      if (serverOnline) {
        try {
          const payload = {
            data_file: currentExamConfig.data_file,
            students: allExamData.students,
            audit_log: teacherAuditLog
          };
          const res = await fetch("/api/save_verified_data", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const ret = await res.json();
          if (ret.ok) {
            showToast("🎉 " + ret.message);
            saveLocalAuditCache();
            return;
          }
        } catch (e) {}
      }

      // Fallback tải file JSON
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allExamData, null, 2));
      const a = document.createElement('a');
      const baseFn = currentExamConfig.data_file.split('/').pop().replace('.json', '');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `${baseFn}_da_duyet.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("📥 Đã tải file JSON đã duyệt về máy!");
    }

    /* =========================================================
       PHÍM TẮT & TIỆN ÍCH
    ========================================================= */
    function initKeyboard() {
      window.addEventListener("keydown", (e) => {
        const tag = (e.target.tagName || "").toLowerCase();
        if (tag === "input" || tag === "textarea" || tag === "select") return;

        if (e.code === "Space") {
          e.preventDefault();
          if (e.shiftKey || e.ctrlKey) {
            markCurrentStudentAllVerified();
          } else {
            markCurrentTabVerified();
          }
        } else if (e.code === "ArrowLeft" || e.code === "KeyA") {
          e.preventDefault();
          navigateStudent(-1);
        } else if (e.code === "ArrowRight" || e.code === "KeyD") {
          e.preventDefault();
          navigateStudent(1);
        } else if (e.code === "Digit1") {
          switchMode('OMR');
        } else if (e.code === "Digit2") {
          switchMode('HW');
        } else if (e.code === "Digit3") {
          switchMode('ESSAY');
        } else if (e.code === "Digit4") {
          switchMode('FULL');
        }
      });
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      document.getElementById("toastMsg").textContent = msg;
      box.style.display = "flex";
      if (window.toastTimer) clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => { box.style.display = "none"; }, 3000);
    }

    function showHelpModal() {
      alert("⌨️ HƯỚNG DẪN DUYỆT BÀI SIÊU TỐC THEO TỪNG TAB:\n\n" +
        "• Phím 1, 2, 3, 4: Chuyển giữa các Tab (1. OMR, 2. Điền khuyết, 3. Tự luận, 4. Toàn trang)\n" +
        "• Phím Space: DUYỆT RIÊNG TAB ĐANG MỞ & tự động chuyển sang học sinh tiếp theo (GIỮ NGUYÊN TAB HIỆN TẠI để duyệt liên tục cả lớp!)\n" +
        "• Phím Shift + Space (hoặc Ctrl + Space): DUYỆT TOÀN BỘ CẢ 3 TAB của học sinh này & chuyển tiếp\n" +
        "• Lọc '⏳ Chưa duyệt Tab này': Lọc ra danh sách các học sinh chưa duyệt xong phần hiện tại\n" +
        "• Phím A / Mũi tên Trái: Lùi về học sinh trước\n" +
        "• Phím D / Mũi tên Phải: Sang học sinh tiếp theo\n" +
        "• Nút 💾 Lưu: Ghi dữ liệu đã duyệt xuống máy chủ (tự động sao lưu bản backup an toàn).");
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function triggerMathRender() {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
      }
    }
  </script>
</body>
